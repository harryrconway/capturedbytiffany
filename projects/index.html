<!DOCTYPE html>
<html lang="en" class="no-js">
<head>
	<meta charset="utf-8">
	<!-- A meta CSP governs only what is parsed AFTER it, so it sits second —
	     ahead of the inline class flip below and every link in this head.
	     script-src carries the sha256 of that one inline script; the hash is
	     over the exact 42 bytes between its tags. Change one character of
	     that line and the page stops flipping to .js: it would then come up
	     only on the 4s failsafe (style.css 13 PAGE FADE).

	     style-src-attr is what keeps the style="--pos:…" / style="--i:…"
	     attributes working while inline <style> ELEMENTS stay blocked; where
	     it is unsupported the crops fall back to their 50%/50% default and
	     the nav stagger flattens, both cosmetic. form-action 'none' is
	     correct: this form posts nowhere (main.js 06 ENQUIRY intercepts) and
	     the mail hand-off is a link, not a submission.
	     require-trusted-types-for makes the "no HTML from strings" rule
	     structural — any future innerHTML throws.

	     A meta CSP silently ignores frame-ancestors, report-uri/report-to
	     and sandbox; GitHub Pages serves no response headers, so those are
	     not available to us. -->
	<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'sha256-VDVDNNRTREupwUTWnq6itaNdc1TFEVFbXV4xlAS7Gow='; script-src-attr 'none'; style-src 'self'; style-src-attr 'unsafe-inline'; img-src 'self'; font-src 'self'; connect-src 'none'; form-action 'none'; base-uri 'none'; object-src 'none'; frame-src 'none'; require-trusted-types-for 'script'; trusted-types 'none'">

	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>Projects — Capturedbytiffany</title>
	<meta name="description" content="Selected commissions — Capturedbytiffany. Architecture, lifestyle &amp; people, travel &amp; hotels.">
	<meta name="theme-color" content="#FFFCF8">

	<!-- PREVIEW BUILD: kept out of search engines while the copy, credits and
	     photographs are still placeholders. Remove this line at launch. -->
	<meta name="robots" content="noindex">

	<meta property="og:type" content="website">
	<meta property="og:site_name" content="Capturedbytiffany">
	<meta property="og:title" content="Projects — Capturedbytiffany">
	<meta property="og:description" content="Selected commissions. Architecture, lifestyle &amp; people, travel &amp; hotels.">
	<!-- Uncomment once the domain is confirmed
	<link rel="canonical" href="https://capturedbytiffany.com.au/projects/">
	<meta property="og:url" content="https://capturedbytiffany.com.au/projects/">
	-->

	<!-- Flip no-js → js before first paint, so the hidden-until-revealed
	     states only apply when JS is actually there to reveal them -->
	<script>document.documentElement.className = 'js';</script>

	<!-- Favicon: the letter C in the title face, the wordmark's own. Rendered
	     from the TTF to raster — an SVG favicon cannot rely on a web font.
	     Relative paths, so they resolve under the GitHub Pages project path
	     (/capturedbytiffany/) as well as at the root of a custom domain. -->
	<link rel="icon" href="../favicon.ico" sizes="any">
	<link rel="icon" type="image/png" href="../favicon-32.png" sizes="32x32">
	<link rel="apple-touch-icon" href="../apple-touch-icon.png">

	<!-- The same two self-hosted faces as the homepage. crossorigin is
	     required even same-origin: fonts always fetch in CORS mode, and a
	     preload without it doesn't match — it downloads twice. -->
	<link rel="preload" as="font" type="font/woff2" href="../fonts/cormorant-garamond-latin.woff2" crossorigin>
	<link rel="preload" as="font" type="font/woff2" href="../fonts/dm-sans-latin.woff2" crossorigin>

	<!-- Shared with the homepage: a visitor arriving from there has both
	     cached, so this page costs one request -->
	<link rel="stylesheet" href="../style.css">
</head>
